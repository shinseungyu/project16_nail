# 푸시하면 배포를 기다렸다가 바뀐 URL 을 IndexNow 로 알린다.
#
# Bing · Yandex · Seznam · Naver 가 받는다. 구글은 IndexNow 에 참여하지 않으므로
# 구글 색인은 여전히 사이트맵 + Search Console 쪽 일이다.
#
# "무엇이 바뀌었는가"는 사이트맵의 lastmod 로 판단한다(app/sitemap.ts 의 SITE_UPDATED).
# 코드만 고친 배포에서는 제출 대상이 0건이 되는 것이 정상이며, 그게 스팸 방지 장치다.
name: IndexNow

on:
  push:
    branches: [master]
  # 수동 실행. 전체 재제출이 필요할 때 all=true 로 돌린다.
  workflow_dispatch:
    inputs:
      all:
        description: '사이트맵 전체 제출 (평소에는 false)'
        type: boolean
        default: false

# 배포가 연달아 일어나면 마지막 것만 남긴다.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Vercel 배포가 끝나기 전에 제출하면 옛 사이트맵을 읽는다.
      # 배포 성공 웹훅을 받을 곳이 없으므로 넉넉히 기다린다.
      - name: 배포 대기
        if: github.event_name == 'push'
        run: sleep 180

      - name: IndexNow 제출
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '--since=7' }}
